spring.application.name=expense-tracker

# database (override with env vars when deployed)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/expense_tracker}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT: the secret must come from the environment, never from the code
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000

# which website may call this API from a browser
app.cors.allowed-origin=${CORS_ORIGIN:http://localhost:5173}

# Render tells your app which port to use through PORT
server.port=${PORT:8080}